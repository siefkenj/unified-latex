name: Node.js CI

on:
    push:
        branches: ["main", "pretext"]
    pull_request:
        branches: ["main", "pretext"]
    # Allows the CI to be started by hand from the Actions tab, which is useful
    # when a pull request did not trigger a run on its own.
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                # Passed to the dev container's node feature, which takes a major version.
                node-version: ["22", "24"]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v7

            # Builds and starts the dev container in .devcontainer/, then runs the tests inside it.
            # Starting the container runs .devcontainer/postCreateCommand.sh, which does `npm ci`
            # and the build (`unified-latex-cli` first, so that if it errors, the build will fail).
            - name: Build and test in the dev container
              uses: devcontainers/ci@v0.3
              env:
                  # Read by devcontainer.json through `${localEnv:...}` to select the Node version.
                  DEVCONTAINER_NODE_VERSION: ${{ matrix.node-version }}
              with:
                  env: |
                      CI
                  # The last three commands test the actual packages that will be distributed.
                  runCmd: |
                      set -e
                      node --version
                      npm test -- --run
                      npm run test:packages-install
                      npm run test:packages-esm
                      npm run test:packages-cjs
